name: Update Reporter Rankings

on:
  schedule:
    # Once a day. Every run commits a fresh reporter_data.js, so more often than
    # this just grows the repo without making the rankings meaningfully fresher.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: 'Reprocess every part from scratch (ignore cached aggregates)'
        type: boolean
        default: false
      force:
        description: 'Publish even if the volume guard trips'
        type: boolean
        default: false

# Never add a pull_request trigger here: HH_API_KEY must not be exposed to
# workflows that anyone else can start.

permissions:
  contents: write

concurrency:
  group: reporter-rankings-build
  cancel-in-progress: false

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build rankings
        env:
          HH_API_KEY: ${{ secrets.HH_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.rebuild_all }}" = "true" ]; then ARGS="$ARGS --rebuild-all"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python reporter_rankings_build.py $ARGS

      - name: Update timestamp
        run: |
          date -u '+Last updated: %Y-%m-%d %H:%M:%S UTC' > last_updated.txt

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reporter_data.js last_updated.txt agg/
          git diff --staged --quiet && echo "Nothing changed" && exit 0
          git commit -m "Update reporter rankings data - $(date -u '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push origin main
